<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0B0E14">
    <title>J.A.R.V.I.S. Avançado</title>
    <style>
        :root {
            --bg: #0B0E14;
            --bg2: #10141D;
            --bg3: #1A1F2C;
            --accent: #00F0FF;
            --text: #E2E8F0;
            --text-muted: #888;
            --danger: #FF4444;
            --border: #00F0FF33;
        }
        [data-theme="light"] {
            --bg: #F4F6F9;
            --bg2: #FFFFFF;
            --bg3: #E8ECF2;
            --accent: #0077B6;
            --text: #1A1F2C;
            --text-muted: #666;
            --danger: #D32F2F;
            --border: #0077B633;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            background: var(--bg); color: var(--text);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column;
            overscroll-behavior-y: none;
        }

        /* ===== AUTH ===== */
        #auth-overlay {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; width: 100%; gap: 14px; background: var(--bg); padding: 20px;
            position: absolute; z-index: 1000;
        }
        #auth-overlay h2 { color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        #auth-overlay input {
            padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg3); color: var(--text); width: 100%; max-width: 300px; outline: none;
        }
        #auth-overlay button {
            padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
            width: 100%; max-width: 300px;
        }
        .btn-login { background: var(--accent); color: #000; }
        .btn-register { background: var(--bg3); color: var(--accent); border: 1px solid var(--accent); }
        .btn-dev {
            background: var(--bg3); color: var(--accent); border: 1px solid var(--accent);
            margin-top: 16px; font-size: 14px; font-weight: bold; padding: 12px; border-radius: 8px;
            width: 100%; max-width: 300px;
        }
        #auth-msg { color: var(--danger); font-size: 14px; min-height: 20px; }

        /* ===== SIDEBAR ===== */
        #overlay-menu {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
        }
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: var(--bg2); border-right: 1px solid var(--border);
            z-index: 101; transition: left 0.25s ease; display: flex; flex-direction: column;
            padding: 16px 0;
        }
        .sidebar-header {
            color: var(--accent); font-weight: bold; text-align: center;
            padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
        }
        .menu-btn-item {
            background: transparent; color: var(--text); border: none;
            padding: 13px 18px; text-align: left; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; width: 100%;
        }
        .menu-btn-item:hover { background: var(--bg3); color: var(--accent); }
        .menu-btn-danger { color: var(--danger); }
        .chat-list { flex: 1; overflow-y: auto; padding: 8px 10px; }
        .chat-item {
            padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer;
            font-size: 13px; background: var(--bg3); border: 1px solid transparent;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-item.active { border-color: var(--accent); color: var(--accent); }
        .chat-item:hover { border-color: var(--border); }
        .chat-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 0 4px; }

        /* ===== APP ===== */
        #app-container { display: none; flex-direction: column; height: 100%; width: 100%; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--accent); font-size: 18px; font-weight: bold; letter-spacing: 1px;
            padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
        }
        .btn-hamburguer, .header-btn {
            background: transparent; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 4px 6px;
        }
        .header-title { flex: 1; text-align: center; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;
        }
        .msg-user-wrapper { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .msg-jarvis-wrapper { align-self: flex-start; max-width: 85%; display: flex; flex-direction: column; gap: 4px; }
        .msg-user {
            background: var(--bg3); border: 1px solid var(--border); color: var(--text);
            padding: 11px 14px; border-radius: 14px 14px 0 14px; word-wrap: break-word; line-height: 1.45;
        }
        .msg-jarvis {
            background: var(--bg2); border: 1px solid var(--accent); color: var(--accent);
            padding: 11px 14px; border-radius: 14px 14px 14px 0; word-wrap: break-word; line-height: 1.5;
        }
        .msg-jarvis strong { color: var(--text); }
        .msg-actions { display: flex; gap: 12px; padding-left: 4px; }
        .action-btn {
            background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .action-btn:hover { color: var(--accent); }

        .code-block {
            background: #000; border-radius: 8px; margin: 8px 0; border: 1px solid var(--border); overflow: hidden;
        }
        [data-theme="light"] .code-block { background: #1e1e1e; }
        .code-block-header {
            background: var(--bg3); padding: 5px 10px; display: flex; justify-content: space-between;
            font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border);
        }
        .copy-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: bold; }
        .code-block pre { padding: 10px; overflow-x: auto; font-family: monospace; font-size: 13px; color: #E2E8F0; margin: 0; }

        /* ===== INPUT ===== */
        .input-wrapper { padding: 10px 14px 14px; background: var(--bg); }
        .pill-container {
            display: flex; align-items: flex-end; background: var(--bg3);
            border-radius: 24px; padding: 8px 10px; gap: 6px; width: 100%; max-width: 700px; margin: 0 auto;
        }
        .pill-container textarea {
            flex: 1; min-width: 0; background: transparent; border: none; color: var(--text);
            font-size: 16px; outline: none; padding: 8px 4px; resize: none;
            line-height: 1.4; max-height: 140px; overflow-y: auto;
            font-family: inherit; min-height: 24px;
        }
        .icon-btn-pill {
            background: transparent; border: none; color: var(--text); font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 5px; border-radius: 50%;
            flex-shrink: 0; margin-bottom: 2px;
        }
        .btn-send-pill, .btn-stop-pill {
            border: none; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
            flex-shrink: 0;
        }
        .btn-send-pill { background: #1a3673; color: #fff; }
        .btn-stop-pill { background: var(--danger); color: #fff; display: none; }
        .mic-recording { color: var(--danger) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

        #preview-container { color: var(--accent); font-size: 12px; text-align: center; margin-bottom: 6px; display: none; }
        .suggestions { display: flex; gap: 8px; overflow-x: auto; padding: 0 4px 8px; }
        .suggestion-chip {
            background: var(--bg3); border: 1px solid var(--border); color: var(--text-muted);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer;
        }
        .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== PANELS ===== */
        .overlay-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
        .painel {
            display: flex; flex-direction: column; position: fixed; top: 0; right: -100%;
            width: 100%; max-width: 380px; height: 100%; background: var(--bg2);
            border-left: 1px solid var(--border); z-index: 201; transition: right 0.25s ease;
        }
        .painel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid var(--border);
        }
        .painel-titulo { color: var(--accent); font-weight: bold; font-size: 15px; }
        .painel-fechar { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .lista-memorias { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .memoria-item {
            background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.4;
        }
        .memoria-texto { color: var(--text); white-space: pre-wrap; word-wrap: break-word; max-height: 90px; overflow-y: auto; }
        .btn-del-memoria { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; }
        .config-row { margin-bottom: 16px; }
        .config-row label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .config-row input, .config-row select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg3); color: var(--text); outline: none; font-size: 14px;
        }
        .btn-primary {
            width: 100%; padding: 12px; border-radius: 8px; border: none;
            background: var(--accent); color: #000; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .typing-indicator {
            display: none; align-self: flex-start; padding: 10px 16px;
            background: var(--bg2); border: 1px solid var(--accent); border-radius: 14px 14px 14px 0;
            color: var(--accent); font-size: 14px;
        }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%{opacity:.2} 20%{opacity:1} 100%{opacity:.2} }

        /* Toast de memória */
        #toast-memoria {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--bg2); color: var(--accent); border: 1px solid var(--accent);
            padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
            max-width: 90%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #toast-memoria.show {
            opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- AUTH -->
    <div id="auth-overlay">
        <h2>J.A.R.V.I.S. Auth</h2>
        <input type="text" id="username" placeholder="Nome do Usuário">
        <input type="password" id="password" placeholder="Senha/PIN">
        <button class="btn-login" onclick="login()">ACESSAR</button>
        <button class="btn-register" onclick="registrar()">CADASTRAR USUÁRIO</button>
        <p id="auth-msg"></p>
        <button class="btn-dev" onclick="modoDesenvolvedor()">Modo Desenvolvedor</button>
    </div>

    <!-- SIDEBAR -->
    <div id="overlay-menu" onclick="fecharMenu()"></div>
    <div id="sidebar">
        <div class="sidebar-header">J.A.R.V.I.S.</div>
        <button class="menu-btn-item" onclick="novaConversa()">+ Nova Conversa</button>
        <div class="chat-list" id="chat-list"></div>
        <button class="menu-btn-item" id="btn-toggle-voz" onclick="toggleVoz()">Voz: LIGADA</button>
        <button class="menu-btn-item" onclick="toggleTheme()">Tema</button>
        <button class="menu-btn-item" onclick="abrirGerenciarMemorias()">Memorias</button>
        <button class="menu-btn-item" onclick="abrirConfig()">Configuracoes</button>
        <button class="menu-btn-item menu-btn-danger" onclick="confirmarLimpeza()">Limpar Conversa</button>
        <button class="menu-btn-item" style="border-top:1px solid var(--border);margin-top:8px;" onclick="fazerLogout()">Sair</button>
    </div>

    <!-- MEMÓRIAS -->
    <div class="overlay-panel" id="overlay-memorias" onclick="fecharGerenciarMemorias()"></div>
    <div class="painel" id="painel-memorias">
        <div class="painel-header">
            <span class="painel-titulo">MEMÓRIAS SEMÂNTICAS</span>
            <button class="painel-fechar" onclick="fecharGerenciarMemorias()">×</button>
        </div>
        <div class="lista-memorias">
            <p style="color:var(--text-muted);font-size:12px;margin-bottom:14px;line-height:1.5;">
                Fatos permanentes com busca semântica (embeddings). O J.A.R.V.I.S. recupera automaticamente os mais relevantes.
            </p>
            <div id="lista-fatos"></div>
        </div>
        <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <input type="text" id="novo-fato" placeholder="Ex: Meu time é o Flamengo" style="flex:1;padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;font-size:13px;" onkeypress="if(event.key==='Enter')adicionarFato()">
            <button class="icon-btn-pill" style="background:#1a3673;border-radius:8px;width:44px;color:#fff;" onclick="adicionarFato()">+</button>
        </div>
    </div>

    <!-- CONFIG -->
    <div class="overlay-panel" id="overlay-config" onclick="fecharConfig()"></div>
    <div class="painel" id="painel-config">
        <div class="painel-header">
            <span class="painel-titulo">CONFIGURAÇÕES</span>
            <button class="painel-fechar" onclick="fecharConfig()">×</button>
        </div>
        <div class="lista-memorias">

                <label>Chave da API Groq</label>
                <input type="password" id="cfg-api-key" placeholder="gsk_...">
            </div>
            <div class="config-row">
                <label>Modelo padrão</label>
                <select id="cfg-model">
                    <option value="openai/gpt-oss-120b">GPT-OSS 120B (recomendado + busca web)</option>
                    <option value="openai/gpt-oss-20b">GPT-OSS 20B (rápido + busca web)</option>
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                    <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
                    <option value="qwen/qwen3.6-27b">Qwen 3.6 27B (visão)</option>
                    <option value="groq/compound">Groq Compound (ferramentas nativas)</option>
                </select>
            </div>
            <div class="config-row">
                <label>Usar busca web automática</label>
                <select id="cfg-websearch">
                    <option value="true">Sim (tool calling)</option>
                    <option value="false">Não</option>
                </select>
            </div>
            <div class="config-row">
                <label>Perguntar antes de memorizar</label>
                <select id="cfg-confirm-mem">
                    <option value="false">Não (salva automaticamente)</option>
                    <option value="true">Sim (pedir confirmação)</option>
                </select>
            </div>
            <div class="config-row">
                <label>Voz do J.A.R.V.I.S.</label>

            </div>

                <select id="cfg-pitch">
                    <option value="0.7">Mais grave</option>
                    <option value="0.75" selected>Grave (JARVIS)</option>
                    <option value="0.85">Medio-grave</option>
                    <option value="1.0">Normal</option>

                <select id="cfg-rate">
                    <option value="0.95">Calma</option>

            <button class="btn-primary" onclick="salvarConfig()">Salvar Configurações</button>

            <button class="menu-btn-item menu-btn-danger" style="margin-top:20px;justify-content:center;border:1px solid var(--danger);border-radius:8px;" onclick="confirmarApagarTudo()">Apagar Todos os Dados</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app-container">
        <div class="header">
            <button class="btn-hamburguer" onclick="abrirMenu()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <span class="header-title" id="header-title">J.A.R.V.I.S.</span>
            <button class="header-btn" onclick="novaConversa()" title="Nova conversa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div class="chat-area" id="chat"></div>
        <div class="typing-indicator" id="typing">J.A.R.V.I.S. está pensando<span>.</span><span>.</span><span>.</span></div>
        <div id="toast-memoria"></div>
        <div id="preview-container">Arquivo pronto para envio</div>
        <div class="suggestions" id="suggestions"></div>
        <div class="input-wrapper">
            <div class="pill-container">
                <label for="arquivo" class="icon-btn-pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></label>
                <input type="file" id="arquivo" accept="image/*,.txt,.md,.csv,.json,.pdf" style="display:none;" onchange="previewArquivo()">

                <button id="btn-mic" class="icon-btn-pill" onclick="toggleMic()">
                    <svg width="18" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                </button>
                <button class="btn-send-pill" id="btn-send" onclick="enviarMensagem()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
                <button class="btn-stop-pill" id="btn-stop" onclick="pararGeracao()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
            </div>
        </div>
    </div>

<script type="module">
// ===================== EMBEDDINGS (Transformers.js) =====================
let embedder = null;
let embeddingsReady = false;

async function initEmbeddings() {
    try {
        const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
        embeddingsReady = true;
        console.log('Embeddings prontos');
    } catch (e) {
        console.warn('Embeddings não carregaram, usando fallback keyword:', e);
        embeddingsReady = false;
    }
}

async function getEmbedding(text) {
    if (!embeddingsReady || !embedder) return null;
    const out = await embedder(text, { pooling: 'mean', normalize: true });
    return Array.from(out.data);
}

function cosineSim(a, b) {
    if (!a || !b || a.length !== b.length) return 0;
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        na += a[i] * a[i];
        nb += b[i] * b[i];
    }
    return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-8);
}

// ===================== STATE =====================
const SUGGESTIONS = [
    "Qual a previsão do tempo hoje?",
    "Resuma as últimas notícias de IA",
    "Me explique de forma simples o que é quantização",
    "Crie um plano de estudos para programação",
    "O que você lembra sobre mim?"
];

let currentUser = null;
let conversas = {};          // { id: { title, messages, created } }
let conversaAtualId = null;
let fatosMemoria = [];       // [{ text, embedding }]
let vozAtivada = true;
let vozSelecionada = '';
let vozPitch = 0.75;
let vozRate = 1.05;
let apiKey = '';
let modeloPadrao = 'openai/gpt-oss-120b';
let usarWebSearch = true;
let confirmarMemoria = false;
let arquivoBase64 = null;
let arquivoNome = null;
let arquivoTipo = null;
let abortController = null;
let gerando = false;

// ===================== ICONS (SVG monocromaticos) =====================

    vozRate = parseFloat(localStorage.getItem('jarvis_rate_' + currentUser) || '1.05');
    atualizarTextoBotaoVoz();
    popularVozes();

    const theme = localStorage.getItem('jarvis_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);

    const salvos = localStorage.getItem('conversas_' + currentUser);
    conversas = salvos ? JSON.parse(salvos) : {};
    const fatosSalvos = localStorage.getItem('fatos_' + currentUser);
    fatosMemoria = fatosSalvos ? JSON.parse(fatosSalvos) : [];

    // garantir embeddings dos fatos (async)
    fatosMemoria.forEach(async (f, i) => {
        if (!f.embedding && embeddingsReady) {
            f.embedding = await getEmbedding(f.text);
            salvarFatos();
        }
    });

    const lastId = localStorage.getItem('conversaAtual_' + currentUser);
    if (lastId && conversas[lastId]) {
        conversaAtualId = lastId;
    } else if (Object.keys(conversas).length) {
        conversaAtualId = Object.keys(conversas)[0];
    } else {
        novaConversa(true);
    }
    renderChatList();
    renderizarChat();
    document.getElementById('cfg-api-key').value = apiKey;
    document.getElementById('cfg-model').value = modeloPadrao;
    document.getElementById('cfg-websearch').value = String(usarWebSearch);
    document.getElementById('cfg-confirm-mem').value = String(confirmarMemoria);

// ===================== SYSTEM PROMPT + SEMANTIC MEMORY =====================
function montarSystemPrompt(query = null) {
    let base = `Você é o J.A.R.V.I.S., assistente pessoal criado por Tony Stark. O usuário atual se chama ${currentUser}.

REGRAS DE RESPOSTA (obrigatórias):
- Responda de forma CURTA e DIRETA. Vá direto ao ponto.
- Dê APENAS o que foi pedido. Não adicione introduções longas, conclusões, sugestões extras ou explicações não solicitadas.
- Se a pergunta for simples, responda em 1 a 3 frases no máximo.
- Só use listas ou blocos de código quando realmente necessário.
- Use Markdown apenas quando ajudar a clareza (negrito, código).
- Você tem acesso a busca na web (tool browser_search). Use-a somente quando a informação for atual ou você não souber.

PROIBIDO (muito importante):
- NUNCA mostre raciocínio, pensamento interno, cadeia de pensamento, "thinking", "reasoning", "let me think", "analisando", "passo a passo" ou qualquer texto antes da resposta final.
- NUNCA use tags como <think>, <reasoning>, [thinking], ou similares.
- A resposta deve conter SOMENTE o conteúdo final destinado ao usuário. Nada de processo mental.

MEMÓRIA AUTOMÁTICA:
- Se o usuário pedir explicitamente para lembrar/guardar/memorizar algo, ou se a informação for pessoal e claramente útil para lembrar depois (preferências, dados pessoais, projetos, rotinas), adicione no FINAL da sua resposta (e somente no final) a tag:
[[LEMBRAR: fato conciso aqui]]
- Use a tag no máximo uma vez por resposta. O fato deve ser curto e em terceira pessoa ou direto (ex: "Prefere café sem açúcar", "Trabalha com Python").
- Não explique a tag. Ela é invisível para o usuário final.
- Se não houver nada relevante para lembrar, NÃO use a tag.

Seja conciso como um assistente eficiente.`;

    // Semantic retrieval
    let fatosRelevantes = fatosMemoria;
    if (query && fatosMemoria.length && embeddingsReady) {
        // será calculado de forma síncrona aproximada ou usamos todos se poucos
        fatosRelevantes = fatosMemoria;
    }
    if (fatosRelevantes.length) {
        base += `\n\nInformações permanentes que você deve sempre lembrar sobre este usuário:\n` +
            fatosRelevantes.map(f => `- ${f.text}`).join('\n');
    }
    return base;
}

async function recuperarFatosRelevantes(query, topK = 6) {
    if (!fatosMemoria.length) return [];
    if (!embeddingsReady) return fatosMemoria.slice(0, topK);

    const qEmb = await getEmbedding(query);
    if (!qEmb) return fatosMemoria.slice(0, topK);

    const scored = fatosMemoria.map(f => ({
        text: f.text,
        score: cosineSim(qEmb, f.embedding || [])
    }));
    scored.sort((a,b) => b.score - a.score);
    return scored.filter(s => s.score > 0.25).slice(0, topK);
}

// ===================== CHAT RENDER =====================
function renderizarChat() {
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    const msgs = conversas[conversaAtualId]?.messages || [];
    msgs.forEach((msg, idx) => {
        if (msg.role === 'user') adicionarChat('user', msg.content, idx);
        if (msg.role === 'assistant') adicionarChat('jarvis', msg.content, idx);
    });
    chat.scrollTop = chat.scrollHeight;
}
function parseMarkdown(text) {
    if (!text) return '';
    text = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        return `<div class="code-block"><div class="code-block-header"><span>${lang||'código'}</span>
            <button class="copy-btn" onclick="copiarTexto(this, \`${code.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">${ICON_COPY} Copiar</button></div>
            <pre><code>${code}</code></pre></div>`;
    });
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
}
window.copiarTexto = (btn, texto) => {
    navigator.clipboard.writeText(texto).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = ICON_CHECK + ' Copiado!';
        setTimeout(() => btn.innerHTML = orig, 1800);
    });
};
function adicionarChat(remetente, texto, idx) {
    const chat = document.getElementById('chat');
    if (remetente === 'jarvis') {
        chat.innerHTML += `
            <div class="msg-jarvis-wrapper" data-idx="${idx}">
                <div class="msg-jarvis">${parseMarkdown(texto)}</div>
                <div class="msg-actions">
                    <button class="action-btn" onclick="copiarMensagem(${idx})">${ICON_COPY}</button>
                    <button class="action-btn" onclick="regenerarResposta(${idx})">${ICON_REGEN}</button>
                </div>
            </div>`;
    } else {
        const display = typeof texto === 'string' ? texto : (texto + '');
        chat.innerHTML += `
            <div class="msg-user-wrapper" data-idx="${idx}">
                <div class="msg-user">${display.replace(/</g,'&lt;')}</div>
                <div class="msg-actions">
                    <button class="action-btn" onclick="editarMensagem(${idx})">${ICON_EDIT} Editar</button>
                </div>
            </div>`;
    }
    chat.scrollTop = chat.scrollHeight;
}
window.copiarMensagem = (idx) => {
    const msg = conversas[conversaAtualId].messages[idx];
    if (msg) navigator.clipboard.writeText(msg.content);
};
window.editarMensagem = (idx) => {
    const msg = conversas[conversaAtualId].messages[idx];
    if (!msg || msg.role !== 'user') return;
    const novo = prompt('Editar mensagem:', typeof msg.content === 'string' ? msg.content : '');
    if (novo === null) return;
    // remove a partir desta mensagem (inclusive respostas posteriores)
    conversas[conversaAtualId].messages = conversas[conversaAtualId].messages.slice(0, idx);
    conversas[conversaAtualId].messages.push({ role: 'user', content: novo.trim() });
    salvarConversas();
    renderizarChat();
    enviarParaAPI();
};
window.regenerarResposta = (idx) => {
    const msg = conversas[conversaAtualId].messages[idx];
    if (!msg || msg.role !== 'assistant') return;
    conversas[conversaAtualId].messages.splice(idx, 1);
    salvarConversas();
    renderizarChat();
    enviarParaAPI();
};

window.previewArquivo = () => {
    const input = document.getElementById('arquivo');
    if (!input.files?.[0]) return;
    const file = input.files[0];
    arquivoNome = file.name;
    arquivoTipo = file.type;

    if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                const max = 800;
                if (w > h && w > max) { h *= max/w; w = max; }
                else if (h > max) { w *= max/h; h = max; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                arquivoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                document.getElementById('preview-container').style.display = 'block';
                document.getElementById('preview-container').innerHTML = ICON_IMG + ' Imagem pronta';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        // texto
        const reader = new FileReader();
        reader.onload = e => {
            arquivoBase64 = e.target.result; // text content
            document.getElementById('preview-container').style.display = 'block';
            document.getElementById('preview-container').innerHTML = ICON_FILE + ' ' + file.name;
        };
        reader.readAsText(file);
    }
};

    recognition.continuous = false;
    recognition.onstart = () => document.getElementById('btn-mic').classList.add('mic-recording');
    recognition.onend = () => document.getElementById('btn-mic').classList.remove('mic-recording');
    recognition.onresult = e => {
        const el = document.getElementById('campoTexto');
        el.value = e.results[0][0].transcript;
        autoResize(el);
        enviarMensagem();
    };
}
window.toggleMic = () => {
    if (!recognition) return alert('Navegador não suporta reconhecimento de voz.');
    recognition.start();
};
function popularVozes() {
    const sel = document.getElementById('cfg-voice');
    if (!sel || !('speechSynthesis' in window)) return;
    const preencher = () => {
        const voices = speechSynthesis.getVoices();
        sel.innerHTML = '';
        // Ordena: prioriza inglês britânico masculino, depois outras
        const preferidas = ['en-GB', 'en-US', 'pt-BR', 'pt-PT'];
        const sorted = [...voices].sort((a, b) => {
            const score = (v) => {
                let s = 0;
                if (/male|daniel|george|arthur|thomas|james|ravi|google uk english male/i.test(v.name)) s += 10;
                if (v.lang.startsWith('en-GB')) s += 8;
                if (v.lang.startsWith('en-US')) s += 4;
                if (v.lang.startsWith('pt')) s += 2;
                return s;
            };
            return score(b) - score(a);
        });
        sorted.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.name;
            opt.textContent = `${v.name} (${v.lang})`;
            if (v.name === vozSelecionada) opt.selected = true;
            sel.appendChild(opt);
        });
        if (!vozSelecionada && sorted.length) {
            // auto-escolhe a melhor
            const best = sorted[0];
            vozSelecionada = best.name;
            sel.value = best.name;
        }
    };
    preencher();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = preencher;
    }
}

window.testarVoz = () => {
    const texto = 'At your service, sir. All systems are operational.';
    falarJarvis(texto, true);
};

function falarJarvis(texto, forcar = false) {
    if ((!vozAtivada && !forcar) || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto.replace(/[*#`_~\[\]]/g, ''));
    const voices = speechSynthesis.getVoices();
    const chosen = voices.find(v => v.name === vozSelecionada) || voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|george/i.test(v.name)) || voices[0];
    if (chosen) u.voice = chosen;
    u.lang = chosen?.lang || 'en-GB';
    u.pitch = vozPitch;
    u.rate = vozRate;
    window.speechSynthesis.speak(u);
}

// ===================== API + STREAMING + TOOLS =====================
window.handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!gerando) enviarMensagem();
    }
};
window.autoResize = (el) => {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
};

window.enviarMensagem = async () => {
    if (gerando) return;
    const campo = document.getElementById('campoTexto');
    let texto = campo.value.trim();
    if (!texto && !arquivoBase64) return;

    // atualiza título da conversa se for a primeira mensagem real
    const msgs = conversas[conversaAtualId].messages;
    if (msgs.length <= 1) {
        conversas[conversaAtualId].title = (texto || arquivoNome || 'Nova conversa').slice(0, 40);
        renderChatList();
    }

    let contentToPush = texto || `[Arquivo: ${arquivoNome}]`;
    if (arquivoBase64 && arquivoTipo?.startsWith('image/')) {
        contentToPush = texto || 'Descreva a imagem.';
    } else if (arquivoBase64 && !arquivoTipo?.startsWith('image/')) {
        contentToPush = (texto ? texto + '\n\n' : '') + `Conteúdo do arquivo ${arquivoNome}:\n\`\`\`\n${arquivoBase64.slice(0, 12000)}\n\`\`\``;
    }

    msgs.push({ role: 'user', content: contentToPush });
    adicionarChat('user', contentToPush, msgs.length - 1);
    campo.value = '';
    campo.style.height = 'auto';
    const tinhaImagem = arquivoBase64 && arquivoTipo?.startsWith('image/');
    const imgData = arquivoBase64;
    arquivoBase64 = null; arquivoNome = null; arquivoTipo = null;
    document.getElementById('arquivo').value = '';
    document.getElementById('preview-container').style.display = 'none';
    document.getElementById('suggestions').style.display = 'none';

    salvarConversas();
    await enviarParaAPI(tinhaImagem ? imgData : null);
};

async function enviarParaAPI(imageBase64 = null) {
    if (!apiKey) {
        alert('Configure sua chave da API Groq em Configuracoes (menu).');
        return;
    }
    gerando = true;
    document.getElementById('btn-send').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'flex';
    document.getElementById('typing').style.display = 'block';

    const msgs = conversas[conversaAtualId].messages;
    // atualiza system com fatos relevantes
    const lastUser = [...msgs].reverse().find(m => m.role === 'user');
    const relevantes = await recuperarFatosRelevantes(lastUser?.content || '', 8);
    const systemContent = montarSystemPrompt() + (relevantes.length ? '\n\nFatos mais relevantes para esta pergunta:\n' + relevantes.map(r => `- ${r.text}`).join('\n') : '');
    msgs[0] = { role: 'system', content: systemContent };

    // prepara mensagens para a API
    let apiMessages = msgs.map(m => {
        if (m.role === 'user' && imageBase64 && m === lastUser) {
            return {
                role: 'user',
                content: [
                    { type: 'text', text: typeof m.content === 'string' ? m.content : 'Analise a imagem.' },
                    { type: 'image_url', image_url: { url: imageBase64 } }
                ]
            };
        }
        return { role: m.role, content: m.content };
    });

    // modelo
    let model = modeloPadrao;
    if (imageBase64) model = 'qwen/qwen3.6-27b';

    // tools
    const tools = [];
    if (usarWebSearch && (model.includes('gpt-oss') || model.includes('compound'))) {
        tools.push({ type: 'browser_search' });
    }

    abortController = new AbortController();
    const tempId = 'temp-' + Date.now();
    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg-jarvis-wrapper" id="wrap-${tempId}"><div class="msg-jarvis" id="${tempId}"></div></div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const body = {
            model,
            messages: apiMessages,
            max_tokens: 1024,
            stream: true,
            temperature: 0.7
        };
        if (tools.length) body.tools = tools;

        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + apiKey,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body),
            signal: abortController.signal
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error?.message || `Erro HTTP ${resp.status}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6).trim();
                    if (data === '[DONE]') continue;
                    try {
                        const parsed = JSON.parse(data);
                        const delta = parsed.choices?.[0]?.delta?.content || '';
                        if (delta) {
                            fullText += delta;
                            document.getElementById(tempId).innerHTML = parseMarkdown(fullText);
                            chat.scrollTop = chat.scrollHeight;
                        }
                    } catch {}
                }
            }
        }

        // finaliza
        document.getElementById(`wrap-${tempId}`)?.remove();
        if (fullText) {
            // Remove raciocínio interno se o modelo vazar
            let textoLimpo = fullText
                .replace(/<think>[\s\S]*?<\/think>/gi, '')
                .replace(/<thinking>[\s\S]*?<\/thinking>/gi, '')
                .replace(/\[thinking\][\s\S]*?\[\/thinking\]/gi, '')
                .replace(/\[reasoning\][\s\S]*?\[\/reasoning\]/gi, '')
                .replace(/^[\s\S]*?(?=\n\n|$)/, (m) => {
                    // se começar com frases de raciocínio comuns, tenta limpar blocos iniciais longos
                    if (/^(let me think|thinking|raciocínio|analisando|passo a passo|okay,|hmm)/i.test(m.trim()) && m.length > 200) return '';
                    return m;
                });

            // Extrai e processa memória automática
            const memoriaMatch = textoLimpo.match(/\[\[LEMBRAR:\s*(.+?)\]\]/i);
            textoLimpo = textoLimpo.replace(/\[\[LEMBRAR:\s*.+?\]\]/gi, '').trim();
            if (memoriaMatch) {
                const fato = memoriaMatch[1].trim();
                if (fato) {
                    const jaExiste = fatosMemoria.some(f => f.text.toLowerCase() === fato.toLowerCase());
                    if (!jaExiste) {
                        const salvar = async () => {
                            try {
                                const emb = await getEmbedding(fato);
                                fatosMemoria.push({ text: fato, embedding: emb });
                            } catch {
                                fatosMemoria.push({ text: fato, embedding: null });
                            }
                            salvarFatos();
                            mostrarToastMemoria(fato);
                        };
                        if (confirmarMemoria) {
                            if (confirm('Salvar na memória?\n\n"' + fato + '"')) {
                                salvar();
                            }
                        } else {
                            salvar();
                        }
                    }
                }
            }
            msgs.push({ role: 'assistant', content: textoLimpo });
            adicionarChat('jarvis', textoLimpo, msgs.length - 1);
            salvarConversas();
            falarJarvis(textoLimpo);
        } else {
            throw new Error('Resposta vazia da API');
        }
    } catch (err) {
        if (err.name === 'AbortError') {
            document.getElementById(tempId).innerText = '(geração interrompida)';
        } else {
            console.error(err);
            const el = document.getElementById(tempId);
            if (el) el.innerHTML = `Erro: ${err.message}<br><button class="action-btn" onclick="enviarParaAPI()">Tentar novamente</button>`;
        }
    } finally {
        gerando = false;
        document.getElementById('btn-send').style.display = 'flex';
        document.getElementById('btn-stop').style.display = 'none';
        document.getElementById('typing').style.display = 'none';
        abortController = null;
    }
}

window.pararGeracao = () => {
    if (abortController) abortController.abort();
};
