<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Viewport bloqueado para evitar zoom e arrastes indesejados no mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Pessoal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        body {
            background-color: #0B0E14;
            color: #E2E8F0;
            /* 100dvh garante que o app se adapte quando o teclado do celular abrir */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; /* Trava o scroll da página inteira */
            display: flex;
            flex-direction: column;
            overscroll-behavior-y: none; /* Evita o "puxar para recarregar" do Android */
            touch-action: pan-y; /* Permite apenas rolagem vertical onde for necessário (no chat) */
        }
        
        /* ================= TELA DE LOGIN ================= */
        #auth-overlay {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            gap: 15px;
            background: #0B0E14;
            padding: 20px;
            position: absolute;
            z-index: 1000;
        }
        #auth-overlay h2 { color: #00F0FF; text-transform: uppercase; letter-spacing: 2px; }
        #auth-overlay input {
            padding: 12px; border-radius: 8px; border: 1px solid #00F0FF66;
            background: #1A1F2C; color: #FFF; width: 100%; max-width: 300px; outline: none;
        }
        #auth-overlay button {
            padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
            width: 100%; max-width: 300px;
        }
        .btn-login { background-color: #00F0FF; color: #000; }
        .btn-register { background-color: #1A1F2C; color: #00F0FF; border: 1px solid #00F0FF; }
        #auth-msg { color: #FF4444; font-size: 14px; }

        /* ================= MENU LATERAL (SIDEBAR) ================= */
        #overlay-menu {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 100;
        }
        #sidebar {
            position: fixed;
            top: 0; left: -280px; /* Escondido fora da tela */
            width: 260px;
            height: 100vh;
            background-color: #10141D;
            border-right: 1px solid #00F0FF33;
            z-index: 101;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .sidebar-header {
            color: #00F0FF;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #00F0FF33;
            margin-bottom: 10px;
        }
        .menu-btn-item {
            background: transparent;
            color: #E2E8F0;
            border: none;
            padding: 15px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn-item:hover { background-color: #1A1F2C; color: #00F0FF; }
        .menu-btn-danger { color: #FF4444; }
        .menu-btn-danger:hover { background-color: rgba(255, 68, 68, 0.1); color: #FF4444; }

        /* ================= TELA PRINCIPAL ================= */
        #app-container {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00F0FF;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px;
            border-bottom: 1px solid #00F0FF33;
            background: #0B0E14;
        }
        .btn-hamburguer {
            background: transparent;
            border: none;
            color: #00F0FF;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }
        /* Espaçador invisível para centralizar o título J.A.R.V.I.S */
        .header-spacer { width: 34px; } 

        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg-user {
            align-self: flex-end; background-color: #1A1F2C; border: 1px solid #00F0FF44;
            color: #FFFFFF; padding: 10px 14px; border-radius: 12px 12px 0 12px; max-width: 80%;
        }
        .msg-jarvis {
            align-self: flex-start; background-color: #10141D; border: 1px solid #00F0FFaa;
            color: #00F0FF; padding: 10px 14px; border-radius: 12px 12px 12px 0; max-width: 85%;
        }

        #preview-container { color: #00F0FF; font-size: 12px; text-align: center; margin-bottom: 5px; display: none; }

        /* ================= NOVO INPUT (INSPIRADO NA IMAGEM) ================= */
        .input-wrapper {
            padding: 10px 15px 15px 15px;
            background: #0B0E14;
        }
        .pill-container {
            display: flex;
            align-items: center;
            background-color: #1E1E1E; /* Cinza escuro da imagem */
            border-radius: 50px; /* Formato de pílula */
            padding: 6px 8px;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .pill-container input[type="text"] {
            flex-grow: 1;
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 16px;
            outline: none;
            padding: 8px 5px;
        }
        .pill-container input[type="text"]::placeholder {
            color: #888;
        }

        .icon-btn-pill {
            background: transparent;
            border: none;
            color: #FFF;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px 10px;
            border-radius: 50%;
        }

        /* Botão de enviar azul circular */
        .btn-send-pill {
            background-color: #1a3673; /* Azul escuro da imagem */
            color: #FFF;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .btn-send-pill:active {
            transform: scale(0.95);
        }
        
        /* Animação do mic gravando */
        .mic-recording {
            color: #FF4444 !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <!-- OVERLAY DE AUTENTICAÇÃO -->
    <div id="auth-overlay">
        <h2>J.A.R.V.I.S. Auth</h2>
        <input type="text" id="username" placeholder="Nome do Usuário">
        <input type="password" id="password" placeholder="Senha/PIN">
        <button class="btn-login" onclick="login()">ACESSAR</button>
        <button class="btn-register" onclick="registrar()">CADASTRAR USUÁRIO</button>
        <p id="auth-msg"></p>
    </div>

    <!-- MENU LATERAL -->
    <div id="overlay-menu" onclick="fecharMenu()"></div>
    <div id="sidebar">
        <div class="sidebar-header">MENU</div>
        
        <button class="menu-btn-item" onclick="abrirConfig()">⚙️ Configurações</button>
        <button class="menu-btn-item menu-btn-danger" onclick="confirmarLimpeza()">🗑️ Resetar Memória</button>
        
        <div style="flex-grow: 1;"></div> <!-- Empurra o botão de sair pra baixo -->
        
        <button class="menu-btn-item" style="border-top: 1px solid #00F0FF33;" onclick="fazerLogout()">🚪 Sair</button>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="app-container">
        <!-- Header com Hamburguer -->
        <div class="header">
            <button class="btn-hamburguer" onclick="abrirMenu()">☰</button>
            <span>J.A.R.V.I.S.</span>
            <div class="header-spacer"></div>
        </div>
        
        <!-- Área de Chat -->
        <div class="chat-area" id="chat"></div>
        
        <div id="preview-container">📷 Imagem Pronta para Envio</div>

        <!-- Nova Área de Input (Inspirada na Imagem) -->
        <div class="input-wrapper">
            <div class="pill-container">
                <!-- Botão de Anexo (+) -->
                <label for="imagem" class="icon-btn-pill" style="font-size: 28px; font-weight: 300;">+</label>
                <input type="file" id="imagem" accept="image/*" style="display:none;" onchange="previewImagem()">
                
                <!-- Campo de Texto -->
                <input type="text" id="campoTexto" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                
                <!-- Botão de Microfone -->
                <button id="btn-mic" class="icon-btn-pill" onclick="toggleMic()">
                    <!-- Ícone SVG simples de Mic para ficar limpo -->
                    <svg width="20" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                </button>
                
                <!-- Botão Enviar (Circulo Azul) -->
                <button class="btn-send-pill" onclick="enviarMensagem()">
                    <!-- Ícone de Ondas / Enviar -->
                    ılı
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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"; // <<< INSIRA SUA CHAVE DA GROQ AQUI

        // =============== MENU LATERAL ===============
        function abrirMenu() {
            document.getElementById('overlay-menu').style.display = 'block';
            setTimeout(() => { document.getElementById('sidebar').style.left = '0'; }, 10);
        }
        function fecharMenu() {
            document.getElementById('sidebar').style.left = '-280px';
            setTimeout(() => { document.getElementById('overlay-menu').style.display = 'none'; }, 300);
        }
        function abrirConfig() {
            alert("Em breve: Ajustes de voz, cores e API.");
            fecharMenu();
        }
        function fazerLogout() {
            if(confirm("Deseja realmente sair?")) {
                localStorage.removeItem('currentUser');
                location.reload();
            }
        }
        function confirmarLimpeza() {
            if(confirm("Aviso: Isso apagará toda a memória de conversas. Deseja continuar?")) {
                limparMemoria();
                fecharMenu();
            }
        }

        // =============== SISTEMA DE USUÁRIOS ===============
        function checkAuth() {
            const current = localStorage.getItem('currentUser');
            if (current) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                carregarMemoria(current);
            }
        }

        function registrar() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return showAlert("Preencha nome e senha!");
            
            const users = JSON.parse(localStorage.getItem('jarvisUsers')) || {};
            if (users[user]) return showAlert("Usuário já existe!");
            
            users[user] = pass;
            localStorage.setItem('jarvisUsers', JSON.stringify(users));
            showAlert("Usuário registrado! Agora clique em Acessar.", "#00F0FF");
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const users = JSON.parse(localStorage.getItem('jarvisUsers')) || {};
            
            if (users[user] && users[user] === pass) {
                localStorage.setItem('currentUser', user);
                checkAuth();
            } else {
                showAlert("Acesso Negado. Usuário ou senha incorretos.");
            }
        }

        function showAlert(msg, color = "#FF4444") {
            const el = document.getElementById('auth-msg');
            el.innerText = msg;
            el.style.color = color;
        }

        // =============== MEMÓRIA (HISTÓRICO) ===============
        let historico = [];
        let systemPrompt = {};

        function carregarMemoria(user) {
            systemPrompt = { 
                role: "system", 
                content: `Você é o J.A.R.V.I.S., assistente criado por Tony Stark. O usuário atual que você está atendendo se chama ${user}. Responda de forma curta, direta, polida e chame-o de Senhor ${user}.` 
            };

            const salva = localStorage.getItem('memoria_' + user);
            if (salva) {
                historico = JSON.parse(salva);
                renderizarChat();
            } else {
                historico = [systemPrompt];
                adicionarChat("jarvis", `Sistemas operacionais, Senhor ${user}.`);
                falarJarvis(`Sistemas operacionais, Senhor ${user}.`);
            }
        }

        function salvarMemoria() {
            const user = localStorage.getItem('currentUser');
            localStorage.setItem('memoria_' + user, JSON.stringify(historico));
        }

        function limparMemoria() {
            historico = [systemPrompt];
            salvarMemoria();
            document.getElementById('chat').innerHTML = '';
            adicionarChat("jarvis", "Memória anterior apagada com sucesso, Senhor.");
        }

        // =============== INTERFACE E CHAT ===============
        function renderizarChat() {
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            historico.forEach(msg => {
                if (msg.role === 'user') adicionarChat('user', formatarConteudoUsuario(msg.content));
                if (msg.role === 'assistant') adicionarChat('jarvis', msg.content);
            });
        }

        function formatarConteudoUsuario(content) {
            if (typeof content === 'string') return content;
            let texto = "";
            content.forEach(item => {
                if (item.type === 'text') texto += item.text;
                if (item.type === 'image_url') texto += " [📷 Imagem Analisada]";
            });
            return texto;
        }

        function adicionarChat(remetente, texto) {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-${remetente}">${texto}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function handleEnter(e) {
            if(e.key === "Enter") enviarMensagem();
        }

        // =============== PROCESSAMENTO DE IMAGEM ===============
        let imagemBase64 = null;
        function previewImagem() {
            const input = document.getElementById('imagem');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagemBase64 = e.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // =============== RECONHECIMENTO DE VOZ ===============
        let microfoneAtivo = false;
        let recognition;
        const btnMic = document.getElementById('btn-mic');
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'pt-BR';
            
            recognition.onstart = function() {
                btnMic.classList.add('mic-recording');
                microfoneAtivo = true;
            };
            
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('campoTexto').value = transcript;
                enviarMensagem(); 
            };
            
            recognition.onend = function() {
                btnMic.classList.remove('mic-recording');
                microfoneAtivo = false;
            };
        }

        function toggleMic() {
            if (!recognition) return alert("Seu navegador não suporta captura de voz.");
            if (microfoneAtivo) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // =============== SINTETIZADOR DE VOZ ===============
        function falarJarvis(texto) {
            if ('speechSynthesis' in window) {
                const textoLimpo = texto.replace(/[*#]/g, ''); 
                const utterance = new SpeechSynthesisUtterance(textoLimpo);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.2;
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // =============== INTEGRAÇÃO API GROQ ===============
        async function enviarMensagem() {
            const campo = document.getElementById("campoTexto");
            const texto = campo.value.trim();

            if (!texto && !imagemBase64) return;

            let textoUsuario = texto || "Descreva detalhadamente a imagem anexada.";
            let conteudoEnvio = textoUsuario;
            let modeloRecomendado = "llama-3.3-70b-versatile"; 

            if (imagemBase64) {
                modeloRecomendado = "llama-3.2-11b-vision-preview"; 
                conteudoEnvio = [
                    { type: "text", text: textoUsuario },
                    { type: "image_url", image_url: { url: imagemBase64 } }
                ];
                adicionarChat("user", textoUsuario + " [📷]");
            } else {
                adicionarChat("user", textoUsuario);
            }

            historico.push({ role: "user", content: conteudoEnvio });
            
            campo.value = "";
            imagemBase64 = null;
            document.getElementById('imagem').value = "";
            document.getElementById('preview-container').style.display = 'none';

            const tempId = "temp-" + Date.now();
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-jarvis" id="${tempId}">Processando...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const resposta = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: modeloRecomendado,
                        messages: historico,
                        max_tokens: 1024
                    })
                });

                const dados = await resposta.json();
                if (dados.error) throw new Error(dados.error.message);
                
                const textoJarvis = dados.choices[0].message.content;
                
                document.getElementById(tempId).innerText = textoJarvis;
                historico.push({ role: "assistant", content: textoJarvis });
                salvarMemoria();
                falarJarvis(textoJarvis);

            } catch (erro) {
                document.getElementById(tempId).innerText = "Erro nos sistemas. Verifique sua chave da API ou conexão.";
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
