<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Pessoal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        
        body {
            background-color: #0B0E14;
            color: #E2E8F0;
            height: 100dvh; 
            width: 100%; /* CORREÇÃO: 100% em vez de 100vw evita que a barra passe da tela na direita */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior-y: none;
            touch-action: pan-y;
        }
        
        /* ================= TELA DE LOGIN ================= */
        #auth-overlay {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            gap: 15px;
            background: #0B0E14;
            padding: 20px;
            position: absolute;
            z-index: 1000;
        }
        #auth-overlay h2 { color: #00F0FF; text-transform: uppercase; letter-spacing: 2px; }
        #auth-overlay input {
            padding: 12px; border-radius: 8px; border: 1px solid #00F0FF66;
            background: #1A1F2C; color: #FFF; width: 100%; max-width: 300px; outline: none;
        }
        #auth-overlay button {
            padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
            width: 100%; max-width: 300px;
        }
        .btn-login { background-color: #00F0FF; color: #000; }
        .btn-register { background-color: #1A1F2C; color: #00F0FF; border: 1px solid #00F0FF; }
        #auth-msg { color: #FF4444; font-size: 14px; }

        /* ================= MENU LATERAL ================= */
        #overlay-menu {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.6);
            z-index: 100;
        }
        #sidebar {
            position: fixed;
            top: 0; left: -280px;
            width: 260px;
            height: 100vh;
            background-color: #10141D;
            border-right: 1px solid #00F0FF33;
            z-index: 101;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .sidebar-header {
            color: #00F0FF;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #00F0FF33;
            margin-bottom: 10px;
        }
        .menu-btn-item {
            background: transparent;
            color: #E2E8F0;
            border: none;
            padding: 15px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn-item:hover { background-color: #1A1F2C; color: #00F0FF; }
        .menu-btn-danger { color: #FF4444; }
        .menu-btn-danger:hover { background-color: rgba(255, 68, 68, 0.1); color: #FF4444; }

        /* ================= TELA PRINCIPAL ================= */
        #app-container {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00F0FF;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px;
            border-bottom: 1px solid #00F0FF33;
            background: #0B0E14;
        }
        .btn-hamburguer {
            background: transparent;
            border: none;
            color: #00F0FF;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }
        .header-spacer { width: 34px; } 

        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg-user {
            align-self: flex-end; background-color: #1A1F2C; border: 1px solid #00F0FF44;
            color: #FFFFFF; padding: 10px 14px; border-radius: 12px 12px 0 12px; max-width: 80%;
            word-wrap: break-word;
        }
        .msg-jarvis {
            align-self: flex-start; background-color: #10141D; border: 1px solid #00F0FFaa;
            color: #00F0FF; padding: 10px 14px; border-radius: 12px 12px 12px 0; max-width: 85%;
            word-wrap: break-word;
        }

        #preview-container { color: #00F0FF; font-size: 12px; text-align: center; margin-bottom: 5px; display: none; }

        /* ================= INPUT ================= */
        .input-wrapper {
            padding: 10px 15px 15px 15px;
            background: #0B0E14;
            width: 100%;
        }
        .pill-container {
            display: flex;
            align-items: center;
            background-color: #1E1E1E; 
            border-radius: 50px; 
            padding: 6px 8px;
            gap: 6px; /* CORREÇÃO: Menos espaço entre os itens para caber telas pequenas */
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .pill-container input[type="text"] {
            flex-grow: 1;
            min-width: 0; /* CORREÇÃO: Impede que o campo de texto empurre o botão pra fora */
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 16px;
            outline: none;
            padding: 8px 5px;
        }
        .pill-container input[type="text"]::placeholder {
            color: #888;
        }

        .icon-btn-pill {
            background: transparent;
            border: none;
            color: #FFF;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .btn-send-pill {
            background-color: #1a3673; 
            color: #FFF;
            border: none;
            border-radius: 50%;
            width: 40px; /* Levemente menor para caber melhor */
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .btn-send-pill:active { transform: scale(0.95); }
        
        .mic-recording {
            color: #FF4444 !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div id="auth-overlay">
        <h2>J.A.R.V.I.S. Auth</h2>
        <input type="text" id="username" placeholder="Nome do Usuário">
        <input type="password" id="password" placeholder="Senha/PIN">
        <button class="btn-login" onclick="login()">ACESSAR</button>
        <button class="btn-register" onclick="registrar()">CADASTRAR USUÁRIO</button>
        <p id="auth-msg"></p>
    </div>

    <div id="overlay-menu" onclick="fecharMenu()"></div>
    <div id="sidebar">
        <div class="sidebar-header">MENU</div>
        <button class="menu-btn-item" onclick="abrirConfig()">⚙️ Configurações</button>
        <button class="menu-btn-item menu-btn-danger" onclick="confirmarLimpeza()">🗑️ Resetar Memória</button>
        <div style="flex-grow: 1;"></div>
        <button class="menu-btn-item" style="border-top: 1px solid #00F0FF33;" onclick="fazerLogout()">🚪 Sair</button>
    </div>

    <div id="app-container">
        <div class="header">
            <button class="btn-hamburguer" onclick="abrirMenu()">☰</button>
            <span>J.A.R.V.I.S.</span>
            <div class="header-spacer"></div>
        </div>
        
        <div class="chat-area" id="chat"></div>
        <div id="preview-container">📷 Imagem Pronta para Envio</div>

        <div class="input-wrapper">
            <div class="pill-container">
                <label for="imagem" class="icon-btn-pill" style="font-size: 28px; font-weight: 300;">+</label>
                <input type="file" id="imagem" accept="image/*" style="display:none;" onchange="previewImagem()">
                
                <input type="text" id="campoTexto" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                
                <button id="btn-mic" class="icon-btn-pill" onclick="toggleMic()">
                    <svg width="20" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                </button>
                
                <button class="btn-send-pill" onclick="enviarMensagem()">ılı</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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"; 

        // =============== MENU LATERAL ===============
        function abrirMenu() {
            document.getElementById('overlay-menu').style.display = 'block';
            setTimeout(() => { document.getElementById('sidebar').style.left = '0'; }, 10);
        }
        function fecharMenu() {
            document.getElementById('sidebar').style.left = '-280px';
            setTimeout(() => { document.getElementById('overlay-menu').style.display = 'none'; }, 300);
        }
        function abrirConfig() { alert("Em breve: Ajustes de voz, cores e API."); fecharMenu(); }
        function fazerLogout() {
            if(confirm("Deseja realmente sair?")) {
                localStorage.removeItem('currentUser');
                location.reload();
            }
        }
        function confirmarLimpeza() {
            if(confirm("Aviso: Isso apagará toda a memória de conversas. Deseja continuar?")) {
                limparMemoria();
                fecharMenu();
            }
        }

        // =============== SISTEMA DE USUÁRIOS ===============
        function checkAuth() {
            const current = localStorage.getItem('currentUser');
            if (current) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                carregarMemoria(current);
            }
        }
        function registrar() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return showAlert("Preencha nome e senha!");
            const users = JSON.parse(localStorage.getItem('jarvisUsers')) || {};
            if (users[user]) return showAlert("Usuário já existe!");
            users[user] = pass;
            localStorage.setItem('jarvisUsers', JSON.stringify(users));
            showAlert("Usuário registrado! Agora clique em Acessar.", "#00F0FF");
        }
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const users = JSON.parse(localStorage.getItem('jarvisUsers')) || {};
            if (users[user] && users[user] === pass) {
                localStorage.setItem('currentUser', user);
                checkAuth();
            } else {
                showAlert("Acesso Negado. Usuário ou senha incorretos.");
            }
        }
        function showAlert(msg, color = "#FF4444") {
            const el = document.getElementById('auth-msg');
            el.innerText = msg;
            el.style.color = color;
        }

        // =============== MEMÓRIA ===============
        let historico = [];
        let systemPrompt = {};

        function carregarMemoria(user) {
            systemPrompt = { 
                role: "system", 
                content: `Você é o J.A.R.V.I.S., assistente criado por Tony Stark. O usuário atual que você está atendendo se chama ${user}. Responda de forma curta, direta e polida.` 
            };
            const salva = localStorage.getItem('memoria_' + user);
            if (salva) {
                historico = JSON.parse(salva);
                renderizarChat();
            } else {
                historico = [systemPrompt];
                adicionarChat("jarvis", `Sistemas operacionais, Senhor ${user}.`);
                falarJarvis(`Sistemas operacionais, Senhor ${user}.`);
            }
        }
        function salvarMemoria() {
            const user = localStorage.getItem('currentUser');
            localStorage.setItem('memoria_' + user, JSON.stringify(historico));
        }
        function limparMemoria() {
            historico = [systemPrompt];
            salvarMemoria();
            document.getElementById('chat').innerHTML = '';
            adicionarChat("jarvis", "Memória apagada. O que deseja agora?");
        }

        function renderizarChat() {
            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            historico.forEach(msg => {
                if (msg.role === 'user') adicionarChat('user', msg.content);
                if (msg.role === 'assistant') adicionarChat('jarvis', msg.content);
            });
        }
        function adicionarChat(remetente, texto) {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-${remetente}">${texto}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
        function handleEnter(e) { if(e.key === "Enter") enviarMensagem(); }

        // =============== PROCESSAMENTO DE IMAGEM (COM COMPRESSÃO) ===============
        let imagemBase64 = null;
        function previewImagem() {
            const input = document.getElementById('imagem');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // Comprime a imagem pelo Canvas para evitar o erro de limite de tamanho da Groq
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const max_dim = 800; 

                        if (width > height && width > max_dim) {
                            height *= max_dim / width;
                            width = max_dim;
                        } else if (height > max_dim) {
                            width *= max_dim / height;
                            height = max_dim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Transforma em jpeg comprimido a 70%
                        imagemBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('preview-container').style.display = 'block';
                    }
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // =============== RECONHECIMENTO DE VOZ ===============
        let microfoneAtivo = false;
        let recognition;
        const btnMic = document.getElementById('btn-mic');
        
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'pt-BR';
            recognition.onstart = function() { btnMic.classList.add('mic-recording'); microfoneAtivo = true; };
            recognition.onresult = function(event) {
                document.getElementById('campoTexto').value = event.results[0][0].transcript;
                enviarMensagem(); 
            };
            recognition.onend = function() { btnMic.classList.remove('mic-recording'); microfoneAtivo = false; };
        }
        function toggleMic() {
            if (!recognition) return alert("Seu navegador não suporta captura de voz.");
            microfoneAtivo ? recognition.stop() : recognition.start();
        }

        function falarJarvis(texto) {
            if ('speechSynthesis' in window) {
                const textoLimpo = texto.replace(/[*#]/g, ''); 
                const utterance = new SpeechSynthesisUtterance(textoLimpo);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.2;
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // =============== INTEGRAÇÃO API GROQ ===============
        async function enviarMensagem() {
            const campo = document.getElementById("campoTexto");
            const texto = campo.value.trim();

            if (!texto && !imagemBase64) return;

            let textoUsuario = texto || "Descreva a imagem.";
            let modeloRecomendado = "llama-3.3-70b-versatile"; 
            
            // Criamos uma cópia do histórico apenas para essa requisição
            let mensagensAPI = [...historico]; 

            if (imagemBase64) {
                modeloRecomendado = "llama-3.2-11b-vision-preview"; 
                // Envia a imagem para a API
                mensagensAPI.push({
                    role: "user",
                    content: [
                        { type: "text", text: textoUsuario },
                        { type: "image_url", image_url: { url: imagemBase64 } }
                    ]
                });
                
                // SALVA APENAS O TEXTO NA MEMÓRIA PARA NÃO BUGAR O MODELO NAS PRÓXIMAS MENSAGENS
                historico.push({ role: "user", content: textoUsuario + " [📷 Imagem Analisada]" });
                adicionarChat("user", textoUsuario + " [📷]");
            } else {
                mensagensAPI.push({ role: "user", content: textoUsuario });
                historico.push({ role: "user", content: textoUsuario });
                adicionarChat("user", textoUsuario);
            }
            
            campo.value = "";
            imagemBase64 = null;
            document.getElementById('imagem').value = "";
            document.getElementById('preview-container').style.display = 'none';

            const tempId = "temp-" + Date.now();
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-jarvis" id="${tempId}">Processando...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const resposta = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: modeloRecomendado,
                        messages: mensagensAPI,
                        max_tokens: 1024
                    })
                });

                const dados = await resposta.json();
                if (dados.error) throw new Error(dados.error.message);
                
                const textoJarvis = dados.choices[0].message.content;
                
                document.getElementById(tempId).innerText = textoJarvis;
                historico.push({ role: "assistant", content: textoJarvis });
                salvarMemoria();
                falarJarvis(textoJarvis);

            } catch (erro) {
                document.getElementById(tempId).innerText = "Erro nos sistemas. Verifique sua chave da API ou conexão.";
                console.error(erro);
            }
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
